databases:
  - name: passrescue-db
services:
  - type: web
    name: passrescue-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: passrescue-db
          property: connectionString
      - key: ALLOWED_ORIGIN
        sync: false
